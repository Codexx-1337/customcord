name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Customcord
        run: cargo build --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/customcord.exe -DestinationPath customcord-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Customcord ${{ github.ref_name }}
          files: |
            target/release/customcord.exe
            customcord-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
